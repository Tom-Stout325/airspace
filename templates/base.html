<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AirSpace{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fb; }
        .auth-shell { min-height: 100vh; }
        .auth-card { border: 0; border-radius: 1.25rem; box-shadow: 0 1rem 2rem rgba(13, 27, 62, 0.08); }
        .brand-mark { width: 3rem; height: 3rem; border-radius: 1rem; display:flex; align-items:center; justify-content:center; background:#0d6efd; color:#fff; font-weight:700; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="{% url 'accounts:home' %}">AirSpace</a>
        <div class="ms-auto d-flex gap-2 align-items-center">
            {% if request.user.is_authenticated %}
                <span class="navbar-text small text-muted d-none d-md-inline">{{ request.user.email }}</span>
                <a class="btn btn-outline-secondary btn-sm" href="{% url 'accounts:logout' %}">Log out</a>
            {% else %}
                <a class="btn btn-outline-secondary btn-sm" href="{% url 'accounts:login' %}">Log in</a>
                <a class="btn btn-primary btn-sm" href="{% url 'accounts:register' %}">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

<main>
    {% if messages %}
        <div class="container pt-3">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>
    {% endif %}
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
