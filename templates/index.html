<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AirSpace{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <div class="site-shell d-flex flex-column">
      <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
          <a class="navbar-brand fw-bold" href="{% url 'accounts:home' %}">AirSpace</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="mainNav">
            <div class="ms-auto d-flex align-items-center gap-3 py-3 py-lg-0">
              {% if request.user.is_authenticated %}
                <span class="text-secondary small">{{ request.user.email }}</span>
                {% if request.user.is_staff %}<a class="btn btn-sm btn-outline-dark" href="{% url 'accounts:invitation_list' %}">Invitations</a>{% endif %}
                <a class="btn btn-sm btn-outline-dark" href="{% url 'accounts:logout' %}">Log out</a>
              {% else %}
                <a class="btn btn-sm btn-outline-dark" href="{% url 'accounts:login' %}">Sign in</a>

              {% endif %}
            </div>
          </div>
        </div>
      </nav>

      <main class="container py-4 py-md-5 flex-grow-1">
        {% if messages %}
          <div class="mb-4">
            {% for message in messages %}
              <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
              </div>
            {% endfor %}
          </div>
        {% endif %}
        {% block content %}{% endblock %}
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
