{% extends 'index.html' %}{% block title %}Complete Pilot Profile{% endblock %}{% block content %}<div class="row justify-content-center"><div class="col-12 col-lg-7"><div class="card border-0 shadow-sm rounded-4"><div class="card-body p-4 p-md-5"><p class="text-uppercase small text-secondary fw-semibold">Account setup</p><h1 class="h2">Complete your pilot profile</h1><p class="text-secondary">Confirm your contact and FAA certificate information before creating a waiver.</p><form method="post" class="row g-3">{% csrf_token %}<div class="col-md-6"><label class="form-label">First name</label><input class="form-control" name="first_name" value="{{ request.user.first_name }}" required></div><div class="col-md-6"><label class="form-label">Last name</label><input class="form-control" name="last_name" value="{{ request.user.last_name }}" required></div><div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone" value="{{ request.user.phone }}"></div><div class="col-md-6"><label class="form-label">FAA certificate number</label><input class="form-control" name="license_number" value="{{ profile.license_number }}"></div><div class="col-12"><button class="btn btn-dark">Save and continue</button></div></form></div></div></div></div>{% endblock %}
