<div class="{{ column_class|default:'col-12' }}">
  <fieldset class="operation-choice-fieldset">
    <legend class="form-label fw-semibold mb-2">
      {{ field.label }}
      {% if field.field.required %}<span class="text-danger" aria-hidden="true">*</span>{% endif %}
    </legend>

    <div class="operation-choice-grid">
      {% for choice in field %}
        <div class="form-check operation-choice-item">
          {{ choice.tag }}
          <label class="form-check-label" for="{{ choice.id_for_label }}">
            {{ choice.choice_label }}
          </label>
        </div>
      {% endfor %}
    </div>

    {% for error in field.errors %}
      <div class="invalid-feedback d-block mt-2">{{ error }}</div>
    {% endfor %}

    {% if field.help_text %}
      <div class="form-text mt-2">{{ field.help_text }}</div>
    {% endif %}
  </fieldset>
</div>
