{% extends "index.html" %}
{% block title %}Delete Drone | AirSpace{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 720px;">
  <div class="card border-danger shadow-sm"><div class="card-body p-4"><h1 class="h3 text-danger">Delete drone</h1><p>Are you sure you want to delete <strong>{{ drone }}</strong>?</p><p class="text-muted">This action cannot be undone.</p><form method="post">{% csrf_token %}<div class="d-flex gap-2"><button type="submit" class="btn btn-danger">Delete drone</button><a href="{% url 'drones:detail' drone.pk %}" class="btn btn-outline-secondary">Cancel</a></div></form></div></div>
</div>
{% endblock %}
